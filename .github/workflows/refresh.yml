name: Osveži podatke

on:
  # Enkrat na dan: register pogodb ima več tisoč zapisov in skenov za OCR, zato zajem traja več dni;
  # potem vsak zagon prenese le novosti.
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      pogodbe:
        description: "Samo te pogodbe iz registra (id-ji, ločeni z vejico); prazno pomeni vse nove"
        required: false
        default: ""
      minute:
        description: "Časovni proračun za pogodbe (minute)"
        required: false
        default: "120"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "pipeline/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Črpanje s portala javnih naročil le po urniku ali ročno (portal prosi za največ dva zagona na dan);
  # ob spremembi kode se stran samo znova zgradi iz shranjenih podatkov.
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    concurrency:
      group: collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Namesti orodja za PDF in OCR
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-slv

      - name: Prenesi nove objave DARS s portala javnih naročil
        if: ${{ !inputs.pogodbe }}
        run: python -m pipeline.collect

      - name: Prenesi nove pogodbe iz registra pogodb
        env:
          CONTRACT_MINUTES: ${{ inputs.minute || '120' }}
          CONTRACT_IDS: ${{ inputs.pogodbe }}
        run: python -m pipeline.contracts

      - name: Shrani nove objave in pogodbe v repozitorij
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices data/contracts status/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Nove objave in pogodbe DARS"
            git pull --rebase
            git push
          fi

  deploy:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Zgradi podatke za stran
        run: python -m pipeline.build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
